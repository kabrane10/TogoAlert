<script src="../../assets/js/notifications.js"></script>
<script>
const notifContainer = document.getElementById('notifContainer');

// Simuler notifications citoyen
let notifications = JSON.parse(localStorage.getItem('citoyenNotifications')) || [
  {texte:'Signalement KAL-2025-00123 : statut En cours', date:'2026-01-27', lu:false},
  {texte:'Annonce publique : Travaux route principale', date:'2026-01-26', lu:true}
];

function renderNotifications(){
  notifContainer.innerHTML = '';
  if(notifications.length===0){notifContainer.innerHTML='<p>Aucune notification.</p>';return;}
  notifications.forEach((n,i)=>{
    const card = document.createElement('div');
    card.className=`card ${n.lu?'read':'unread'}`;
    card.innerHTML=`
      <p>${n.texte}</p>
      <small>${n.date}</small>
      <div class="actions">
        <button class="btn small outline" onclick="toggleRead(${i})">${n.lu?'Marquer non lu':'Marquer lu'}</button>
      </div>
    `;
    notifContainer.appendChild(card);
  });
}

function toggleRead(i){notifications[i].lu=!notifications[i].lu;localStorage.setItem('citoyenNotifications',JSON.stringify(notifications));renderNotifications();}

renderNotifications();
</script>
