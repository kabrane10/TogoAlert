<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail signalement – KARAALERT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS global -->
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <link rel="stylesheet" href="../../assets/css/cards.css">
  <link rel="stylesheet" href="../../assets/css/forms.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container header-flex">
    <div class="logo"><img src="../../assets/images/logo.png" alt="">
      <h1>INFO <br>
        <span>TOGO</span></h1></div>
    <nav class="nav">
      <a href="./citoyen-dashboard.html">Dashboard</a>
      <a href="./citoyenmesSigal.html">Mes signalements</a>
      <a href="./citoyenProfil.html">Profil</a>
      <a href="../login.html" class="btn small">Déconnexion</a>
    </nav>
  </div>
</header>

<!-- CONTENU -->
<section class="section">
  <div class="container">

    <div id="signalementDetail" class="card">
      <!-- Détails injectés par JS -->
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container footer-grid">
    <div>
      <strong>KARAALERT</strong>
      <p>Plateforme citoyenne – Ville de Kara</p>
    </div>
  </div>
</footer>

<!-- JS : Affichage détail signalement -->
<script>
  // Récupération de l'ID depuis URL
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  const signalements = JSON.parse(localStorage.getItem('signalements')) || [];
  const s = signalements.find(item => item.id === id);

  const container = document.getElementById('signalementDetail');

  if(!s){
    container.innerHTML = '<p>Signalement introuvable.</p>';
  } else {
    container.innerHTML = `
      <h2>${s.titre}</h2>
      <span class="badge ${s.statut === 'Résolu' ? 'green' : s.statut === 'En cours' ? 'yellow' : 'red'}">
        ${s.statut}
      </span>
      <p><strong>Catégorie :</strong> ${s.categorie}</p>
      <p><strong>Date :</strong> ${s.date}</p>
      <p><strong>Description :</strong><br>${s.description}</p>

      <div class="gallery">
        <p>📸 Photos : (simulées)</p>
        <div class="photos">
          <img src="../assets/images/photo1.png" alt="photo signalement 1">
          <img src="../assets/images/photo2.png" alt="photo signalement 2">
        </div>
      </div>

      <div class="map-placeholder card">
        <p>🗺️ Carte de localisation : ${s.adresse || 'Non renseignée'}</p>
      </div>

      <div class="timeline card">
        <h3>Historique du traitement</h3>
        <ul>
          <li>Reçue — ${s.date}</li>
          <li>En cours — ${s.statut === 'En cours' ? new Date().toLocaleDateString() : '-'}</li>
          <li>Résolue — ${s.statut === 'Résolu' ? new Date().toLocaleDateString() : '-'}</li>
        </ul>
      </div>

      <div class="actions">
        <button class="btn small">Suivre</button>
        <button class="btn small outline">Signaler abus</button>
        <button class="btn small outline">Ajouter commentaire</button>
      </div>
    `;
  }

  function logout() {
  localStorage.removeItem('currentUser');
  sessionStorage.clear(); // 🔥 reset UI
  window.location.href = '../login.html';
}

</script>

</body>
</html>
